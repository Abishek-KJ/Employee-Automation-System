# Thymeleaf configuration 

spring.thymeleaf.cache=false 
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.enabled=true 


# Application Information 

spring.application.name=Employee-Automation-System
info.app.name=Employee-Automation-System
info.app.anothername=Hello World
info.app.description=Contains Employee-Automation-System REST API 
info.app.version=1.0.0 

# Mail Information 

# Configuration 1  

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=employeeautomationsystem@gmail.com
spring.mail.password=twbjaqkyvbbayqsa
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=*



 
# Spring Actuators 

management.endpoints.web.exposure.include=*
management.info.env.enabled=true 

# Configure the Server Port 

server.port=8080


# Database Configuration 

spring.datasource.url=jdbc:mysql://localhost:3310/eas
spring.datasource.username=root
spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver  

# JDBC Properties 

spring.datasource.initialization-mode=always
spring.datasource.test-on-borrow=true
spring.datasource.validation-query=SELECT 1 


#JPA Configuration 

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.connection.autocommit = true

#Location to save uploaded logo file 

upload.directory = uploads/images 

# Set max file size and total request size 

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Reducing the logging level 

spring.main.banner-mode=off
logging.level.root=warn 

# Disable Browser Cache 

spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
server.servlet.session.cookie.http-only=true



