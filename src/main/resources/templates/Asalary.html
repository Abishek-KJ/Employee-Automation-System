<html lang="en" xmlns:th="http://www.thymeleaf.org"> 
	<head> 
		<link rel = "icon" href = "https://static.vecteezy.com/system/resources/previews/053/536/393/non_2x/attended-rpa-multi-color-concept-icon-bots-helping-employees-to-do-tasks-routine-processes-automation-round-shape-line-illustration-abstract-idea-graphic-design-easy-to-use-in-presentation-vector.jpg" type = "image/png"> 
		<title>Admin Dashboard</title>  
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
		   <style>
		       body {
		           font-family: Arial, sans-serif;
		           background: #f2f2f2;
		           margin: 0;
		           padding: 0;
		       }

		       .salary-form-container {
		           background: #fff;
		           max-width: 600px;
		           width: 90%;
		           margin: 40px auto;
		           padding: 30px;
		           border-radius: 10px;
		           box-shadow: 0px 0px 15px rgba(0,0,0,0.2);
		       }

		       h2 {
		           text-align: center;
		           margin-bottom: 25px;
		       }

		       .form-group {
		           margin-bottom: 18px;
		       }

		       label {
		           display: block;
		           margin-bottom: 6px;
		           font-weight: bold;
		       }

		       input[type="number"] {
		           width: 100%;
		           padding: 10px;
		           font-size: 14px;
		           border: 1px solid #ccc;
		           border-radius: 5px;
		       }

		       .submit-btn {
		           width: 100%;
		           padding: 12px;
		           background-color: #007bff;
		           color: white;
		           border: none;
		           border-radius: 5px;
		           font-size: 16px;
		           cursor: pointer;
		           margin-top: 20px;
		       }

		       .submit-btn:hover {
		           background-color: #0056b3;
		       }

		       /* Laptop screens */
		       @media screen and (min-width: 1024px) {
		           .salary-form-container {
		               max-width: 800px;
		           }
		       }
		   </style>
	   </head>	
  <body> 
		<div th:replace="~{fragments/adminpage :: sidebar}"></div> 
		<div class="salary-form-container">
		      <h2>Salary Components</h2>
		      <form th:action = "@{/create-salary/components}" th:object = "${salaryComponents}" method = "post" id="salaryForm"> 
		          <div class="form-group">
		              <label for="basic">Basic Salary (%)</label>
		              <input type="number" id="basic" name="basic" min="0" max="100" th:field = "*{basicSalary}" required> 
		          </div>
		          <div class="form-group">
		              <label for="hra">House Rent Allowance (HRA) (%)</label>
		              <input type="number" id="hra" name="hra" min="0" max="100" th:field = "*{houseRentAllowance}" required>
		          </div>
		          <div class="form-group">
		              <label for="conveyance">Conveyance Allowance (%)</label>
		              <input type="number" id="conveyance" name="conveyance" min="0" max="100" th:field = "*{conveyanceAllowance}" required> 
		          </div>
		          <div class="form-group">
		              <label for="medical">Medical Allowance (%)</label>
		              <input type="number" id="medical" name="medical" min="0" max="100" th:field = "*{medicalAllowance}" required> 
		          </div>
		          <div class="form-group">
		              <label for="special">Special Allowance (%)</label>
		              <input type="number" id="special" name="special" min="0" max="100" th:field = "*{specialAllowance}" required> 
		          </div>
		          <div class="form-group">
		              <label for="pf">Provident Fund (PF) Contribution (%)</label>
		              <input type="number" id="pf" name="pf" min="0" max="100" th:field = "*{providentFund}" required> 
		          </div>
		          <!-- <div class="form-group">
		              <label for="pt">Professional Tax (%)</label>
		              <input type="number" id="pt" name="pt" min="0" max="100" required>
		          </div> --> 

		         <button type="submit" class="submit-btn" onclick = "alert('Salary components added for this month')">Submit</button>
		      </form>
		  </div>

		  <script>
		      document.getElementById('salaryForm').addEventListener('submit', function(event) {
		          event.preventDefault(); // Prevent default submission initially

		          const fields = [
		              { id: 'basic', label: 'Basic Salary' },
		              { id: 'hra', label: 'House Rent Allowance (HRA)' },
		              { id: 'conveyance', label: 'Conveyance Allowance' },
		              { id: 'medical', label: 'Medical Allowance' },
		              { id: 'special', label: 'Special Allowance' },
		              { id: 'pf', label: 'Provident Fund (PF) Contribution' }
		          ];

		          for (let field of fields) {
		              const input = document.getElementById(field.id);
		              const value = parseInt(input.value);

		              if (isNaN(value) || value < 0 || value > 100) {
		                  Swal.fire({
		                      icon: 'error',
		                      title: 'Invalid Input',
		                      text: `${field.label} must be between 0 and 100.`,
		                      timer: 2000,
		                      showConfirmButton: false
		                  });
		                  return; // Stop validation and do not submit
		              }
		          }

		          // All inputs are valid
		          Swal.fire({
		              icon: 'success',
		              title: 'Success',
		              text: 'All salary components are valid!',
		              timer: 1000,
		              showConfirmButton: false
		          }).then(() => {
		              // Submit the form manually
		              document.getElementById('salaryForm').submit();

		              // Call export API after delay
		              setTimeout(() => {
		                  fetch("http://localhost:8080/export/salary", {
		                      method: "GET"
		                  })
		                  .then(response => {
		                      if (!response.ok) throw new Error("Export failed");
		                      return response.blob();
		                  })
		                  .then(blob => {
		                      const url = window.URL.createObjectURL(blob);
		                      const a = document.createElement("a");
		                      a.href = url;
		                      a.download = "salary_export.xlsx";
		                      document.body.appendChild(a);
		                      a.click();
		                      a.remove();
		                  })
		                  .catch(error => {
		                      Swal.fire({
		                          icon: 'error',
		                          title: 'Export Failed',
		                          text: error.message
		                      });
		                  });
		              }, 1000); // delay to ensure form submission finishes
		          });
		      });
		  </script>
		<footer>
		   <div th:replace="~{fragments/footer :: footer}"></div>  
		</footer> 
		
	</body>
</html>
