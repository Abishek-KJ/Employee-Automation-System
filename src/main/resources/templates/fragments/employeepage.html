<!DOCTYPE html> 
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="sidebar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Index</title>
	<link rel = "icon" href = "https://static.vecteezy.com/system/resources/previews/053/536/393/non_2x/attended-rpa-multi-color-concept-icon-bots-helping-employees-to-do-tasks-routine-processes-automation-round-shape-line-illustration-abstract-idea-graphic-design-easy-to-use-in-presentation-vector.jpg" type = "image/png"> 
    <link rel="icon" type="image/x-icon" href="Image-1.jpg"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            margin: 0; 
            font-family: Arial, sans-serif;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        } 

        nav {
            background-color: #007BFF;
            color: white;
            padding: 6px 12px;
            font-size: 16px;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        nav .left-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        nav img {
            width: 30px;
            height: 30px;
        }

        .appname {
            font-weight: bold;
        }

        .navbar {
            display: flex;
            background-color: #007BFF;
            gap: 10px;
        } 

        .navbar-item {
            position: relative; 
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 6px 12px; 
            background-color: #007BFF;
            border-radius: 5px;
            transition: background 0.3s, color 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .navbar a:hover {
            background-color: white;
            color: #007BFF;
        }

        .submenu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #007BFF;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 5px;
            padding: 6px 0;
        }

        .submenu a {
            padding: 6px 12px;
            background-color: #007BFF;
            display: block;
            white-space: nowrap;
            font-size: 11px;
            color: white;
        }

        .submenu a:hover {
            background-color: white;
            color: #007BFF;
        }

        .user-info {
            text-align: center;
            margin: 12px 0;
        }

        .user-info img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }

        .user-info p {
            margin: 6px 0 0;
            font-weight: bold;
            font-size: 12px;
        }

        .content {
            text-align: center;
            padding: 12px;
            font-size: 14px;
            flex: 1;
        }

    </style>
</head>
<body>
    <nav>
        <div class="left-section">
            <a href = "/index">
				<img src="https://static.vecteezy.com/system/resources/previews/053/536/393/non_2x/attended-rpa-multi-color-concept-icon-bots-helping-employees-to-do-tasks-routine-processes-automation-round-shape-line-illustration-abstract-idea-graphic-design-easy-to-use-in-presentation-vector.jpg" alt="EAS Logo">
			</a> 
          	<div class="appname">Employee Automation System	</div> 
        </div> 
        <div class="navbar">
            <div class="navbar-item"> 
                <a href = "/employees/dashboard" onclick="toggleSubmenu('dashboard')"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            </div>
            <div class="navbar-item">
				<a onclick="toggleSubmenu('profileManagement')"><i class="fa-solid fa-id-card"></i>Profile Management<i class="fas fa-chevron-down toggle-icon"></i></a>
				<div class="submenu" id="profileManagement">   
                	<a href = "/employees/profile"><i class="fas fa-user"></i> My Profile</a>
					<a href = "/Epayroll"><i class="fa-solid fa-money-check"></i> Payroll</a>
				</div>
            </div>
            <div class="navbar-item">
                <a onclick="toggleSubmenu('leaveType')"><i class="fas fa-calendar-check"></i>  Leave Management <i class="fas fa-chevron-down toggle-icon"></i></a>
                <div class="submenu" id="leaveType">
                    <a href="/apply-leave/show"><i class="fas fa-plus-circle"></i>Apply Leave</a>
                    <a href="/apply-leave/leave-history"><i class="fas fa-cogs"></i>Leave History</a> 
					<a href="/Ecalendar"><i class="far fa-calendar-alt"></i> Calendar</a>
                </div> 
            </div>
            <div class="navbar-item">
                <a href="/Echangepassword"><i class="fas fa-key"></i> Change Password</a>
            </div>
            <div class="navbar-item">
                <a href="/welcome"><i class="fas fa-sign-out-alt"></i> Log Out</a>
            </div>
        </div>
    </nav>

    <!-- <div class="user-info">
        <img src="https://via.placeholder.com/50" alt="User Icon">
        <p>Hi, Employee</p>
    </div> --> 

    <script>
        function toggleSubmenu(id) {
            const submenu = document.getElementById(id);
            if (submenu) {
                submenu.style.display = submenu.style.display === 'block' ? 'none' : 'block';
                const toggleIcon = submenu.previousElementSibling.querySelector('.toggle-icon');
                if (toggleIcon) {
                    toggleIcon.classList.toggle('fa-chevron-down');
                    toggleIcon.classList.toggle('fa-chevron-up');
                }
            }
        }
    </script>
</body>
</html>
